<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Grupo Águia Power</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#081a3a;--blue:#2f80ff;--bg:#eef2f8;--sf:#fff;--tx:#0e1b33;--mu:#5d6b85;--ln:#dde4f0;--ok:#16a870;--wa:#e8981a;--er:#e5484d;--okb:#dcf5ea;--wab:#fdf0d8;--erb:#fde3e4;--blb:#dbe9ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#060f22;--sf:#0e2147;--tx:#e8eefb;--mu:#93a4c6;--ln:#1d3563;--okb:#12392f;--wab:#3d2f12;--erb:#401b20;--blb:#162d5a}}
:root[data-theme=dark]{--bg:#060f22;--sf:#0e2147;--tx:#e8eefb;--mu:#93a4c6;--ln:#1d3563;--okb:#12392f;--wab:#3d2f12;--erb:#401b20;--blb:#162d5a}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px Sora,system-ui,sans-serif}
.app{display:grid;grid-template-columns:248px 1fr;height:100%}
.side{background:linear-gradient(180deg,#081a3a,#112b5c);color:#dde8f5;padding:22px 16px;display:flex;flex-direction:column;gap:6px;overflow:auto;border-right:1px solid rgba(47,128,255,0.15);box-shadow:inset -8px 0 24px rgba(47,128,255,0.06)}
.logo{display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;font-weight:800;font-size:18px;line-height:1.1;padding:8px 12px 22px;border-bottom:1px solid rgba(47,128,255,0.35);margin-bottom:6px;text-align:center;letter-spacing:.02em}
.logo img{width:40px;height:40px;border-radius:50%;object-fit:cover;box-shadow:0 2px 8px rgba(47,128,255,0.25)}
.logo small{display:inline;color:#9db6e6;font-weight:400;font-size:9px;letter-spacing:.12em;margin:0 3px 0 0}
.nav{all:unset;cursor:pointer;display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:10px;font-size:13px;font-weight:600;color:#dde8f5;transition:background .15s, color .15s}
.nav:hover{background:#2f80ff22;color:#fff}.nav.on{background:#2f80ff;color:#fff}.nav:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.foot{margin-top:auto;font-size:11px;padding:14px 10px;color:#8ba3d1;border-top:1px solid rgba(255,255,255,0.08);margin-top:12px}
.main{overflow:auto;padding:24px 28px 40px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mu);margin:0 0 20px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.st{background:var(--navy);color:#fff;border-radius:12px;padding:16px}.st b{display:block;font-size:30px;margin:6px 0 2px}.st span{color:#9db6e6;font-size:12px}
.row{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 12px;display:flex;justify-content:space-between}
.card h2 a{font-size:12px;color:var(--blue);cursor:pointer;font-weight:600}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}th{text-align:left;color:var(--mu);font-weight:600;font-size:12px;padding:8px 6px;border-bottom:1px solid var(--ln)}td{padding:11px 6px;border-bottom:1px solid var(--ln);font-size:13px}
.b{border:0;border-radius:99px;padding:4px 10px;font:600 11px Sora,system-ui,sans-serif;cursor:pointer;color:var(--tx)}
.b.ab{background:var(--erb);color:var(--er)}.b.and{background:var(--wab);color:var(--wa)}.b.ok{background:var(--okb);color:var(--ok)}
.donut{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px}.donut div{width:84px;height:84px;border-radius:50%;background:var(--sf);display:grid;place-items:center;text-align:center;font-size:11px;color:var(--mu)}.donut b{display:block;font-size:22px;color:var(--tx)}
.lg{display:flex;justify-content:space-between;padding:4px 0}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}
.vis{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln);align-items:center;justify-content:space-between}.vis small,.mu{color:var(--mu)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:99px;padding:7px 14px;font:600 12px Sora,system-ui,sans-serif;cursor:pointer}.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--sf);color:var(--tx);font:13px Sora,system-ui,sans-serif}
.btn{border:0;background:var(--blue);color:#fff;border-radius:8px;padding:10px 18px;font:600 13px Sora,system-ui,sans-serif;cursor:pointer}.btn.g{background:var(--blb);color:var(--blue)}
.top{display:flex;justify-content:space-between;align-items:start;gap:10px;flex-wrap:wrap}
.ov{position:fixed;inset:0;background:#040c1fcc;display:grid;place-items:center;padding:16px;z-index:9}
.md{background:var(--sf);border-radius:14px;padding:22px;width:min(480px,100%);max-height:92%;overflow:auto}
.steps{display:flex;justify-content:space-between;margin:12px 0 18px}.steps span{flex:1;text-align:center;color:var(--mu);font-size:12px;padding-bottom:6px;border-bottom:3px solid var(--ln)}.steps .on{color:var(--blue);border-color:var(--blue);font-weight:600}
.tp{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0 14px}.tp button{border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:8px;padding:12px;cursor:pointer;font:600 13px Sora,system-ui,sans-serif}.tp .on{border-color:var(--blue);background:var(--blb);color:var(--blue)}
label{display:block;font-weight:600;margin:10px 0 6px;font-size:12px}.ck{display:flex;gap:8px;align-items:center;font-weight:400;font-size:13px}.ck input{width:auto}
.ag{display:grid;grid-template-columns:64px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln);align-items:center}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:99px;z-index:40}
.bn{display:none}
@media(max-width:820px){.app{grid-template-columns:1fr}.side{display:none}.main{padding:18px 16px 90px}.cards{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}
.bn{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--navy);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));justify-content:space-around;z-index:8}.bn .nav{flex-direction:column;gap:2px;font-size:11px;padding:6px 10px}}
@media(prefers-reduced-motion:no-preference){.md{animation:p .18s ease-out}@keyframes p{from{transform:scale(.96);opacity:0}}}
.lk{color:var(--blue);cursor:pointer;font-weight:600}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
.obs{background:var(--wab);border-radius:8px;padding:10px 12px;font-size:12px;margin:14px 0 0}
.sv{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.tile{border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:10px;padding:12px;text-align:left;cursor:pointer;font:600 12px Sora,system-ui,sans-serif}.tile.on{border-color:var(--blue);background:var(--blb);color:var(--blue)}
.th{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.th div{position:relative}.th img{width:84px;height:84px;object-fit:cover;border-radius:8px}.th button{position:absolute;top:-6px;right:-6px;border:0;border-radius:50%;width:22px;height:22px;background:var(--er);color:#fff;cursor:pointer}
.pad{width:100%;height:150px;background:#fff;border:1px dashed var(--mu);border-radius:10px;touch-action:none;display:block;margin-top:8px}.sg{display:grid;grid-template-columns:1fr 1fr;gap:16px}
#pr{display:none}@media(max-width:820px){.g3,.sg{grid-template-columns:1fr}}
@page{size:A4;margin:8mm}
#pr{font:11px Arial,Helvetica,sans-serif;color:#000}
.sh{border:1px solid #000}.sh>div{border-top:1px solid #000}.sh>div:first-child{border-top:0}
.rf{display:flex}.rf>div{flex:1;padding:6px 7px;border-right:1px solid #000}.rf>div:last-child{border-right:0}
.ct{text-align:center;padding:5px}.big{font-size:16px;padding:8px}
.sv3{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(5,auto);grid-auto-flow:column;gap:5px 8px;padding:8px 6px}
.sv3 span,.ro{display:flex;align-items:center}
.pb{display:inline-block;width:34px;height:15px;border:1px solid #000;text-align:center;font-weight:700;line-height:14px;margin-right:8px;flex:none}
.pl{border-bottom:2px solid #000;flex:1;min-height:14px;padding:0 4px;margin-left:6px}
.pbx{border:1px solid #000;margin:6px 8px 8px;padding:6px;min-height:42px;white-space:pre-wrap}
.sig{display:flex;gap:24px;padding:8px 10px 6px}.sig>div{flex:1;text-align:center}.sig .s{height:66px;display:flex;align-items:flex-end;justify-content:center}.sig .s img{max-height:62px}.sig .ln{border-top:2px solid #000;font-size:9px;padding-top:3px}
.mt{width:100%;border-collapse:collapse}.mt td,.mt th{border:1px solid #000;padding:5px 6px;text-align:left;height:26px}
@media print{.app,.bn,#ov,#tt{display:none!important}#pr{display:block}html,body{height:auto;background:#fff}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.sgh{background:var(--ln);text-align:center;font-weight:700;padding:10px;font-size:13px}.sg{padding:18px}.sg>div{text-align:center}
.sgb{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;width:100%;height:110px;color:var(--mu);cursor:pointer;border-bottom:2px solid var(--tx);margin-top:6px;font-size:13px}.sgb img{max-height:100px;max-width:100%;background:#fff;border-radius:6px}
.sgl{font-size:11px;margin-top:6px}.sgc{display:inline-block;font-size:11px;margin-top:6px;text-decoration:underline;opacity:.75}
.sgw{position:fixed;top:0;left:0;width:100%;height:100%;z-index:30;background:var(--sf);color:var(--tx);display:flex;flex-direction:column;gap:10px;padding:14px}.sgw.rot{left:100%;transform-origin:0 0;transform:rotate(90deg)}
.sgw canvas{flex:1 1 0;min-height:0;width:100%;background:#fff;border-radius:12px;border:2px dashed var(--mu);touch-action:none}
.sgt{display:flex;justify-content:space-between;gap:10px;align-items:center}.sga{display:flex;gap:10px;justify-content:flex-end}
.ub{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px;color:var(--tx);font-size:12px;margin-bottom:10px}
.side .ub{background:#ffffff12;border-color:#ffffff22;color:#fff}.side .ub .mu{color:#9db6e6}.side .ub select{background:#0b2350;color:#fff;border-color:#ffffff33}
.seg{display:flex;gap:4px;margin-top:8px;background:#0000001f;border-radius:10px;padding:3px}.seg button{flex:1;border:0;border-radius:8px;padding:7px 4px;font:600 11px Sora,system-ui,sans-serif;cursor:pointer;background:transparent;color:inherit}.seg .on{background:var(--blue);color:#fff}
.mub{display:none}@media(max-width:820px){.mub{display:block}}
@media(max-width:820px){.bn .nav{padding:6px 4px;flex:1}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.ch{text-align:center;color:var(--mu);font-size:11px;padding:4px 0}
.cd{all:unset;box-sizing:border-box;cursor:pointer;min-height:62px;border:1px solid var(--ln);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:4px}.cd:hover{background:var(--blb)}.cd.on{border-color:var(--blue);background:var(--blb)}.cd.tdy b{color:var(--blue)}.cd small{font-size:10px;color:var(--mu)}.cd:focus-visible{outline:2px solid var(--blue)}
.dots{display:flex;gap:3px;flex-wrap:wrap;align-items:center}.dt{width:8px;height:8px;border-radius:50%;display:inline-block}.dt.ab{background:var(--er)}.dt.and{background:var(--wa)}.dt.ok{background:var(--ok)}
.gt{min-width:820px}.gr{display:grid;grid-template-columns:110px 1fr;border-top:1px solid var(--ln)}.gl{padding:10px 8px;font-weight:600;font-size:12px;position:sticky;left:0;background:var(--sf);z-index:2}
.gk{position:relative;background:linear-gradient(90deg,var(--ln) 1px,transparent 1px);background-size:calc(100%/14) 100%}.gh{display:grid;grid-template-columns:repeat(14,1fr);color:var(--mu);font-size:10px}.gh span{padding:4px 2px;border-left:1px solid var(--ln)}
.bk{position:absolute;height:30px;border:0;border-radius:8px;padding:0 8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font:600 11px Sora,system-ui,sans-serif;text-align:left;cursor:pointer}.bk:disabled{cursor:default}.bk.ab{background:var(--erb);color:var(--er)}.bk.and{background:var(--wab);color:var(--wa)}.bk.ok{background:var(--okb);color:var(--ok)}
@media(max-width:820px){.cd{min-height:52px;padding:4px}.cd small{display:none}}
</style></head><body><div class="app"><aside class="side" id="side"></aside><main class="main" id="main"></main></div><nav class="bn" id="bn"></nav><div id="ov"></div><div id="tt"></div><div id="pr"></div><div id="sgm"></div>
<script>
const SM={ab:'Aberta',and:'Em andamento',ok:'Concluída'},NX={ab:'and',and:'ok',ok:'ab'};
let OS=[];
const CL=[{n:'Smart Fit - Água Santa',end:'Av. Água Santa, 123 - São Paulo/SP',tel:''},{n:'Smart Fit - Lapa',end:'R. Catão, 88 - São Paulo/SP',tel:''},{n:'Velocit - Sorocaba',end:'Av. Itavuvu, 410 - Sorocaba/SP',tel:''},{n:'Velocit - Minas Gerais',end:'Av. Afonso Pena, 900 - Belo Horizonte/MG',tel:''},{n:'Bio Ritmo - Lapa',end:'R. Clélia, 215 - São Paulo/SP',tel:''}];
const TEC=['João','Carlos','Pedro','Marcos','Lucas','Diego'];
const AG=[['08:00','Velocit - Sorocaba','Manutenção','João / Carlos','ok','2025-10-01'],['09:00','Smart Fit - Água Santa','Instalação','Washington / Marcos','and','2025-10-01'],['14:00','Velocit - Sorocaba','Manutenção','João / Lucas','and','2025-10-01'],['16:00','Bio Ritmo - Lapa','Preventiva','Washington / Diego','ab','2025-10-01']];
const NAV=[['dash','🏠','Dashboard'],['os','📋','Ordens de Serviço'],['ag','📅','Agenda'],['cli','👥','Clientes'],['uni','🏢','Unidades'],['col','🧑‍🔧','Colaboradores'],['prod','📦','Produtos'],['rel','📊','Relatórios'],['perm','🔐','Permissões'],['cfg','⚙️','Configurações'],['set','⚙','Configurações avançadas']];
let V='dash',F='todas',Q='',W=null,nm='';
const $=i=>document.getElementById(i),n=s=>VO().filter(o=>o.s==s).length,pc=s=>VO().length?Math.round(n(s)/VO().length*100):0;
const bd=o=>`<button class="b ${o.s}" title="Clique para mudar o status" onclick="cyc(${o.id})">${SM[o.s]}</button>`;
function cyc(id){const o=OS.find(x=>x.id==id);if(!can('status'))return toast('Você não tem permissão para alterar o status da OS');if(o.s=='ok'&&!can('reabrir'))return toast('Você não tem permissão para reabrir uma OS concluída');o.s=NX[o.s];toast('OS #'+String(o.id).padStart(6,'0')+' agora está '+SM[o.s].toLowerCase());go(V)}
function toast(m){$('tt').innerHTML=`<div class="toast" role="status">${m}</div>`;setTimeout(()=>$('tt').innerHTML='',2400)}
function go(v,nn){V=v;if(nn)nm=nn;draw()}
function tbl(l){return `<div class="tw"><table><tr><th>Nº OS</th><th>Cliente</th><th>Tipo</th><th>Técnico</th><th>Status</th><th>Checklist</th><th>Data</th><th></th></tr>${l.map(o=>`<tr><td><a class="lk" onclick="op(${o.id})">#${String(o.id).padStart(6,'0')}</a></td><td>${o.c}</td><td>${o.t}</td><td>${esc(o.e.split(' / ').join(', '))}</td><td>${bd(o)}</td><td><span class="b ${CB[ckS(o)]}">${CT[ckS(o)]}</span></td><td class="mu">${o.d}</td><td>${can('criar')?`<button class="b" onclick="eo(${o.id})">Editar</button>`:''}</td></tr>`).join('')||'<tr><td colspan=8 class="mu">Nenhuma OS por aqui ainda. Use + Nova OS em Ordens de Serviço para criar a primeira.</td></tr>'}</table></div>`}
function dash(){const t=VO().length,a=pc('ok'),b=a+pc('and');
return `<h1>Olá, ${ME.n.split(' ')[0]}!</h1><p class="sub">Aqui está o resumo da sua operação de hoje.</p>
<div class="cards"><div class="st">Total de OS<b>${t}</b><span>no sistema</span></div><div class="st">Em andamento<b>${n('and')}</b><span>${pc('and')}% do total</span></div><div class="st">Concluídas<b>${n('ok')}</b><span>${pc('ok')}% do total</span></div><div class="st">Abertas<b>${n('ab')}</b><span>${pc('ab')}% do total</span></div></div>
<div class="row"><div><div class="card"><h2>Ordens de Serviço <a onclick="go('os')">Ver todas</a></h2>${tbl(VO().slice(0,5))}</div></div>
<div><div class="card"><h2>Serviços por status</h2><div class="donut" style="background:${t?`conic-gradient(var(--ok) 0 ${a}%,var(--wa) ${a}% ${b}%,var(--er) ${b}% 100%)`:'var(--ln)'}"><div><span><b>${t}</b>OS no total</span></div></div>
${[['ok','Concluídas'],['and','Em andamento'],['ab','Abertas']].map(([k,l])=>`<div class="lg"><span><i class="dot" style="background:var(--${k=='ab'?'er':k=='ok'?'ok':'wa'})"></i>${l}</span><b>${n(k)}</b></div>`).join('')}</div>
<div class="card"><h2>Próximas visitas <a onclick="go('ag')">Ver agenda</a></h2>${nextV().map(x=>`<div class="vis"><span><b>${x[0]}</b> ${x[1]}<br><small>${x[2]}</small></span></div>`).join('')}</div></div></div>`}
function osv(){const l=VO().filter(o=>(F=='todas'||o.s==F)&&(o.c+o.id+o.t).toLowerCase().includes(Q.toLowerCase()));
return `<div class="top"><div><h1>Ordens de Serviço</h1><p class="sub">${l.length} de ${VO().length} ordens</p></div>${can('criar')?'<button class="btn" onclick="nova()">+ Nova OS</button>':''}</div>
<input placeholder="Buscar por número, cliente ou tipo..." value="${Q}" oninput="Q=this.value;draw(1)" aria-label="Buscar OS" style="margin-bottom:12px">
<div class="bar">${[['todas','Todas'],['and','Em andamento'],['ok','Concluídas'],['ab','Abertas']].map(([k,t])=>`<button class="chip ${F==k?'on':''}" onclick="F='${k}';draw()">${t}</button>`).join('')}</div><div class="card">${tbl(l)}</div>`}
function agv(){return `<h1>Agenda</h1><p class="sub">Quarta-feira, 01 de Outubro de 2025</p><div class="card">${AG.filter(x=>can('all')||x[3].split(' / ').includes(ME.t)).map(x=>`<div class="ag"><b>${x[0]}</b><span>${x[1]}<br><small class="mu">${x[2]} · Equipe: ${x[3]}</small></span><span class="b ${x[4]}">${SM[x[4]]}</span></div>`).join('')}</div>`}
function cliv(){return `<div class="top"><div><h1>Clientes e Unidades</h1><p class="sub">${CL.length} unidades ativas</p></div></div><div class="card">${CL.map(c=>`<div class="vis"><span><b>${c.n}</b><br><small>${c.end}</small></span><button class="btn g" onclick="nova('${c.n}')">Nova OS</button></div>`).join('')}</div>`}
function soon(){return `<h1>${nm}</h1><p class="sub">Esta tela entra na próxima etapa. Por enquanto o protótipo cobre Dashboard, Ordens de Serviço, Agenda, Clientes e Permissões.</p>`}
function nova(c){if(!can('criar'))return toast('Você não tem permissão para criar OS');W={s:1,c:c||'',t:'Instalação',d:'',e:[]};mod()}
function mod(){if(!W){$('ov').innerHTML='';return}const s=W.s,T=['Instalação','Manutenção','Preventiva','Correção'];let h='';
if(s==1)h=`<label for=wc>Cliente / unidade</label><select id=wc onchange="W.c=this.value"><option value="">Selecione...</option>${CL.map(c=>`<option ${W.c==c.n?'selected':''}>${c.n}</option>`).join('')}</select>`;
if(s==2)h=`<label>Tipo de serviço</label><div class="tp">${T.map(t=>`<button class="${W.t==t?'on':''}" onclick="W.t='${t}';mod()">${t}</button>`).join('')}</div><label for=wd>Descrição do serviço</label><textarea id=wd rows=3 oninput="W.d=this.value" placeholder="Descreva o serviço que será realizado...">${W.d}</textarea>`;
if(s==3)h=`<label>Técnicos da equipe</label>${tecs().map(t=>`<label class="ck"><input type=checkbox ${W.e.includes(t)?'checked':''} onchange="tg('${t}')">${t}</label>`).join('')}`;
if(s==4)h=`<div class="card"><b>${W.c}</b><br>${W.t}<br><span class="mu">${W.d||'Sem descrição'}</span><br>Equipe: ${W.e.join(' / ')}</div>`;

function ec(i){if(!can('perm'))return;NCI=i;NC={n:US[i].n,tel:US[i].tel||'',em:US[i].em||'',r:[...US[i].r]};ncm()}
function ns(){const n=NC.n.replace(/\s*\/\s*/g,' ').trim(),o=NCI<0?null:US[NCI];if(!n)return toast('Digite o nome do colaborador');if(US.some((u,j)=>j!=NCI&&u.n.toLowerCase()==n.toLowerCase()))return toast('Já existe um colaborador com esse nome');if(!NC.r.length)return toast('Escolha ao menos um perfil');
if(!o){US.push({n,t:n,r:NC.r,tel:NC.tel.trim(),em:NC.em.trim()});toast(n+' foi cadastrado')}
else{if(o.r.includes('adm')&&!NC.r.includes('adm')&&US.filter(x=>x.r.includes('adm')).length==1)return toast('O sistema precisa ter ao menos um administrador');
const old=o.t||o.n;if(old&&old!=n){const rn=e=>e.split(' / ').map(x=>x==old?n:x).join(' / ');OS.forEach(x=>x.e=rn(x.e));AG.forEach(a=>a[3]=rn(a[3]))}
o.n=n;o.t=n;o.r=NC.r;o.tel=NC.tel.trim();o.em=NC.em.trim();if(o===ME&&!o.r.includes(MODE))MODE=o.r[0];toast('Cadastro atualizado')}
NC=null;ncm();rd()}

const CLI=[{n:'Smart Fit',doc:'',tel:'',em:'',ct:''},{n:'Velocit',doc:'',tel:'',em:'',ct:''},{n:'Bio Ritmo',doc:'',tel:'',em:'',ct:''}];
CL.forEach(c=>c.cli=c.n.split(' - ')[0]);
ENT.uni.f=[['n','Unidade'],['sigla','Sigla'],['cli','Cliente','selc'],['ger','Gerente'],['end','Endereço'],['tel','Telefone']];
ENT.cli={h:'Clientes',s:'Novo cliente',L:()=>CLI,f:[['n','Cliente'],['doc','CNPJ'],['tel','Telefone'],['em','E-mail'],['ct','Contato']],x:[['Unidades',r=>CL.filter(c=>c.cli==r.n).length]]};
function lsv(k){const E=ENT[k],ed=can('cad'),L=E.L(),X=E.x||[];return `<div class="top"><div><h1>${E.h}</h1><p class="sub">${L.length} cadastrados</p></div>${ed?`<button class="btn" onclick="ed2('${k}',-1)">+ ${E.s}</button>`:''}</div>
<div class="card"><div class="tw"><table style="min-width:560px"><tr>${E.f.map(f=>`<th>${f[1]}</th>`).join('')}${X.map(x=>`<th>${x[0]}</th>`).join('')}<th></th></tr>${L.map((r,i)=>`<tr>${E.f.map(f=>`<td>${esc(r[f[0]]||'—')}</td>`).join('')}${X.map(x=>`<td>${x[1](r)}</td>`).join('')}<td style="white-space:nowrap">${ed?`<button class="b" onclick="ed2('${k}',${i})">Editar</button> <button class="b ab" onclick="dl('${k}',${i})">Excluir</button>`:''}</td></tr>`).join('')||'<tr><td colspan=9 class="mu">Nenhum cadastro ainda. Use o botão acima para criar o primeiro.</td></tr>'}</table></div></div>${ed?'':'<p class="mu">Só quem tem a permissão de cadastros pode criar ou editar.</p>'}${k=='prod'?'<p class="mu">Os produtos cadastrados aparecem como opção na Lista de materiais do checklist.</p>':''}${k=='cli'?'<p class="mu">Cada cliente pode ter várias unidades. Cadastre as unidades na tela Unidades.</p>':''}`}

let AS=null,AD=null;
const TPS=['Instalação','Manutenção','Preventiva','Correção'];
function td(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fd(d){const t=new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});return t.charAt(0).toUpperCase()+t.slice(1)}
function visV(){return AG.map((x,i)=>({x,i})).filter(({x})=>can('all')||x[3].split(' / ').includes(ME.t)).sort((a,b)=>(a.x[5]+a.x[0]).localeCompare(b.x[5]+b.x[0]))}
function nextV(){return visV().map(r=>r.x).filter(x=>x[4]!='ok').slice(0,3)}
function agv(){const ed=can('agd'),L=visV(),g={};L.forEach(r=>(g[r.x[5]]=g[r.x[5]]||[]).push(r));
return `<div class="top"><div><h1>Agenda</h1><p class="sub">${L.length} visitas</p></div>${ed?'<button class="btn" onclick="ag2(-1)">+ Nova visita</button>':''}</div><div class="cards" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))">${Object.keys(g).map(d=>`<div class="card" style="padding:14px;border-left:4px solid var(--blue);border-radius:10px"><h2 style="font-size:14px;margin:0 0 10px">${fd(d)} <a onclick="go('ag')" style="font-size:11px">Ver tudo</a></h2>${g[d].map(({x,i})=>`<div class="ag" style="padding:10px 0;border-bottom:1px solid var(--ln);display:flex;gap:10px;align-items:center"><div style="width:44px;height:44px;border-radius:8px;background:linear-gradient(135deg,var(--blue),#b8d6ff);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none">${esc(x[0])}</div><div><b style="font-size:14px">${esc(x[1])}</b><small class="mu">${esc(x[2])} · Equipe: ${esc(x[3])}</small></div><span class="b ${x[4]}" style="margin-left:auto;font-size:11px">${SM[x[4]]}</span></div>`).join('')}</div>`).join('')||`<div class="card mu">Nenhuma visita agendada.${ed?' Use o botão acima para criar a primeira.':''}</div>`}</div>`}
function ag2(i){if(!can('agd'))return;const x=AG[i];AS={i,d:i<0?{data:td(),h:'08:00',u:'',t:'Instalação',e:[],s:'ab'}:{data:x[5],h:x[0],u:x[1],t:x[2],e:x[3].split(' / ').filter(Boolean),s:x[4]}};agm()}
function agt(j){const t=tecs()[j],d=AS.d;d.e=d.e.includes(t)?d.e.filter(y=>y!=t):[...d.e,t]}
function agm(){if(!AS){$('ov').innerHTML='';return}const d=AS.d,sl='style="margin-top:6px"';
$('ov').innerHTML=`<div class="ov" onclick="if(event.target==this){AS=null;agm()}"><div class="md" role="dialog" aria-label="Visita"><h2 style="margin:0 0 4px">${AS.i<0?'Nova visita':'Editar visita'}</h2>
<div class="g3" style="grid-template-columns:1fr 1fr"><label>Data<input type=date ${sl} value="${esc(d.data)}" onchange="AS.d.data=this.value"></label><label>Horário<input type=time ${sl} value="${esc(d.h)}" onchange="AS.d.h=this.value"></label></div>
<label>Unidade<select ${sl} onchange="AS.d.u=this.value"><option value="">Selecione...</option>${CL.map(c=>`<option ${d.u==c.n?'selected':''}>${esc(c.n)}</option>`).join('')}</select></label>
<label>Tipo de serviço<select ${sl} onchange="AS.d.t=this.value">${TPS.map(t=>`<option ${d.t==t?'selected':''}>${t}</option>`).join('')}</select></label>
<label>Duração<select ${sl} onchange="AS.d.du=+this.value">${DUR.map(([m,l])=>`<option value="${m}" ${d.du==m?'selected':''}>${l}</option>`).join('')}</select></label><label>Status<select ${sl} onchange="AS.d.s=this.value">${Object.keys(SM).map(k=>`<option value="${k}" ${d.s==k?'selected':''}>${SM[k]}</option>`).join('')}</select></label>
<label>Equipe</label>${tecs().map((t,j)=>`<label class="ck"><input type=checkbox ${d.e.includes(t)?'checked':''} onchange="agt(${j})">${esc(t)}</label>`).join('')}
<div style="display:flex;justify-content:space-between;margin-top:18px"><button class="btn g" onclick="AS=null;agm()">Cancelar</button><button class="btn" onclick="ags()">Salvar visita</button></div></div></div>`}
function ags(){const d=AS.d;if(!d.data)return toast('Escolha a data da visita');if(!d.u)return toast('Escolha a unidade');if(!d.e.length)return toast('Escolha ao menos um técnico');
const r=[d.h||'00:00',d.u,d.t,d.e.join(' / '),d.s,d.data,+d.du||60];if(AS.i<0)AG.push(r);else AG[AS.i]=r;ADT=d.data;AM=d.data.slice(0,7);AS=null;agm();toast('Visita salva');rd()}
function agd(i){AD=i;$('ov').innerHTML=`<div class="ov" onclick="if(event.target==this)$('ov').innerHTML=''"><div class="md" role="dialog" aria-label="Excluir visita"><h2 style="margin:0 0 8px">Excluir esta visita?</h2><p class="mu">${esc(AG[i][1])} · ${esc(AG[i][0])}</p><div style="display:flex;justify-content:space-between;margin-top:18px"><button class="btn g" onclick="$('ov').innerHTML=''">Cancelar</button><button class="btn" style="background:var(--er)" onclick="agdy()">Excluir</button></div></div></div>`}
function agdy(){AG.splice(AD,1);$('ov').innerHTML='';toast('Visita excluída');rd()}

let AV='list',ADT=null,AM='';
const DUR=[[30,'30 min'],[60,'1h'],[90,'1h30'],[120,'2h'],[180,'3h'],[240,'4h']];
function dur(x){const m=x[6]||60;return m<60?m+' min':Math.floor(m/60)+'h'+(m%60?String(m%60).padStart(2,'0'):'')}
function pd(v){return new Date(v+'T12:00:00')}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dd0(){const t=td(),ds=[...new Set(visV().map(r=>r.x[5]))].sort();return ds.find(d=>d>=t)||ds[ds.length-1]||t}
function goT(){ADT=td();AM=ADT.slice(0,7);rd()}
function mm(n){const [y,m]=AM.split('-').map(Number);AM=ymd(new Date(y,m-1+n,1)).slice(0,7);rd()}
function dn(n){const d=pd(ADT);d.setDate(d.getDate()+n);ADT=ymd(d);AM=ADT.slice(0,7);rd()}
function ag2(i,dt){if(!can('agd'))return;const x=AG[i];AS={i,d:i<0?{data:dt||td(),h:'08:00',u:'',t:'Instalação',e:[],s:'ab',du:60}:{data:x[5],h:x[0],u:x[1],t:x[2],e:x[3].split(' / ').filter(Boolean),s:x[4],du:x[6]||60}};agm()}
function vrow(x,i,ed){return `<div class="ag"><b>${esc(x[0])}</b><span>${esc(x[1])}<br><small class="mu">${esc(x[2])} · ${dur(x)} · Equipe: ${esc(x[3])}</small></span><span style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end"><span class="b ${x[4]}">${SM[x[4]]}</span>${ed?`<button class="b" onclick="ag2(${i})">Editar</button><button class="b ab" onclick="agd(${i})">Excluir</button>`:''}</span></div>`}
function listv(L,ed){const g={};L.forEach(r=>(g[r.x[5]]=g[r.x[5]]||[]).push(r));return Object.keys(g).map(d=>`<div class="card"><h2>${fd(d)}</h2>${g[d].map(({x,i})=>vrow(x,i,ed)).join('')}</div>`).join('')||`<div class="card mu">Nenhuma visita agendada.${ed?' Use o botão acima para criar a primeira.':''}</div>`}
function dayList(){const ed=can('agd'),L=visV().filter(r=>r.x[5]==ADT);return `<div class="card"><h2>${fd(ADT)}${ed?'<a onclick="ag2(-1,ADT)">+ Nova visita neste dia</a>':''}</h2>${L.map(({x,i})=>vrow(x,i,ed)).join('')||'<p class="mu" style="margin:0">Nenhuma visita neste dia.</p>'}</div>`}
function calv(){const [y,m]=AM.split('-').map(Number),first=new Date(y,m-1,1),st=first.getDay(),nd=new Date(y,m,0).getDate(),by={};visV().forEach(r=>(by[r.x[5]]=by[r.x[5]]||[]).push(r.x));
const mn=first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});let c=['dom','seg','ter','qua','qui','sex','sáb'].map(d=>`<div class="ch">${d}</div>`).join('')+'<div></div>'.repeat(st);
for(let d=1;d<=nd;d++){const ds=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,L=by[ds]||[];c+=`<button class="cd ${ds==ADT?'on':''} ${ds==td()?'tdy':''}" onclick="ADT='${ds}';rd()" aria-label="${d} de ${mn}, ${L.length} visitas"><b>${d}</b><span class="dots">${L.slice(0,4).map(x=>`<i class="dt ${x[4]}"></i>`).join('')}${L.length>4?'+':''}</span>${L.length?`<small>${L.length} visita${L.length>1?'s':''}</small>`:''}</button>`}
return `<div class="card"><div class="top" style="margin-bottom:10px"><b style="font-size:16px;text-transform:capitalize">${mn}</b><div class="bar" style="margin:0"><button class="chip" onclick="mm(-1)" aria-label="Mês anterior">←</button><button class="chip" onclick="goT()">Hoje</button><button class="chip" onclick="mm(1)" aria-label="Próximo mês">→</button></div></div><div class="cal">${c}</div></div>${dayList()}`}
function tlv(){const ed=can('agd'),H0=6,span=840,tm=h=>{const [a,b]=String(h).split(':').map(Number);return (a||0)*60+(b||0)},day=visV().filter(r=>r.x[5]==ADT),rows=can('all')?tecs():[ME.t].filter(Boolean);
const nav=`<div class="top" style="margin-bottom:10px"><b style="font-size:16px">${fd(ADT)}</b><div class="bar" style="margin:0;align-items:center"><button class="chip" onclick="dn(-1)" aria-label="Dia anterior">←</button><button class="chip" onclick="goT()">Hoje</button><button class="chip" onclick="dn(1)" aria-label="Próximo dia">→</button><input type=date value="${ADT}" onchange="if(this.value){ADT=this.value;AM=ADT.slice(0,7);rd()}" style="width:auto" aria-label="Escolher o dia"></div></div>`;
const hd=`<div class="gr" style="border-top:0"><div class="gl"></div><div class="gh">${Array.from({length:14},(_,i)=>`<span>${String(H0+i).padStart(2,'0')}h</span>`).join('')}</div></div>`;
const body=rows.map(t=>{const it=day.filter(r=>r.x[3].split(' / ').includes(t)).sort((a,b)=>tm(a.x[0])-tm(b.x[0])),ln=[],bl=it.map(r=>{const s=tm(r.x[0]),e=s+(r.x[6]||60);let l=ln.findIndex(z=>z<=s);if(l<0){l=ln.length;ln.push(0)}ln[l]=e;const a=Math.max(s-H0*60,0),w=Math.max(Math.min(e,H0*60+span)-Math.max(s,H0*60),30);return `<button class="bk ${r.x[4]}" style="left:${a/span*100}%;width:${Math.min(w,span-a)/span*100}%;top:${l*34+4}px" ${ed?`onclick="ag2(${r.i})"`:'disabled'} title="${esc(r.x[0]+' · '+r.x[1]+' · '+r.x[2]+' · '+dur(r.x))}"><b>${esc(r.x[0])}</b> ${esc(r.x[1])}</button>`}).join('');
return `<div class="gr"><div class="gl">${esc(t)}</div><div class="gk" style="height:${Math.max(ln.length,1)*34+8}px">${bl}</div></div>`}).join('');
return `<div class="card">${nav}<div class="tw"><div class="gt">${hd}${body||'<p class="mu">Nenhum técnico cadastrado.</p>'}</div></div><p class="mu" style="margin:10px 0 0">${day.length?day.length+' visita'+(day.length>1?'s':'')+' neste dia.':'Nenhuma visita neste dia.'} Cada bloco mostra o horário e a unidade, com o tamanho da duração da visita.${ed?' Toque em um bloco para editar.':''}</p></div>`}
function agv(){if(!ADT){ADT=dd0();AM=ADT.slice(0,7)}const ed=can('agd'),L=visV();
return `<div class="top"><div><h1>Agenda</h1><p class="sub">${L.length} visitas</p></div>${ed?`<button class="btn" onclick="ag2(-1,${AV=='list'?'null':'ADT'})">+ Nova visita</button>`:''}</div><div class="bar">${[['list','Lista'],['cal','Calendário'],['tl','Linha do tempo']].map(([k,t])=>`<button class="chip ${AV==k?'on':''}" onclick="AV='${k}';rd()">${t}</button>`).join('')}</div>${AV=='cal'?calv():AV=='tl'?tlv():listv(L,ed)}`}

let NOS=0,EO=null;
function fdt(v){if(!v)return '';const d=new Date(v),z=n=>String(n).padStart(2,'0');return z(d.getDate())+'/'+z(d.getMonth()+1)+' '+z(d.getHours())+':'+z(d.getMinutes())}
function nowL(){const d=new Date(),z=n=>String(n).padStart(2,'0');return ymd(d)+'T'+z(d.getHours())+':'+z(d.getMinutes())}
function resv(o,s){const ed=can('criar');return `<div class="card"><h2>Dados da OS${ed?`<a onclick="eo(${o.id})">Editar OS</a>`:''}</h2>${[['Cliente',o.c],['Tipo de serviço',o.t],['Data',o.d],['Técnicos',o.e.split(' / ').join(', ')],['Descrição',o.desc||'—']].map(([a,b])=>`<div class="vis"><span class="mu">${a}</span><b style="text-align:right">${esc(b)}</b></div>`).join('')}</div><div class="card"><h2>Checklist</h2><p class="mu">Status: <span class="b ${CB[s]}">${CT[s]}</span></p><button class="btn" onclick="TB='ck';draw()">${s=='pen'?'Preencher checklist':'Abrir checklist'}</button></div>`}
function eo(id){if(!can('criar'))return;const o=OS.find(x=>x.id==id),e=o.e.split(' / ').filter(Boolean);EO={id,L:[...new Set([...tecs(),...e])],d:{c:o.c,t:o.t,s:o.s,e,dt:o.dt||'',desc:o.desc||''}};eom()}
function eot(j){const d=EO.d,t=EO.L[j];d.e=d.e.includes(t)?d.e.filter(x=>x!=t):[...d.e,t]}
function eom(){if(!EO){$('ov').innerHTML='';return}const d=EO.d,sl='style="margin-top:6px"';
$('ov').innerHTML=`<div class="ov" onclick="if(event.target==this){EO=null;eom()}"><div class="md" role="dialog" aria-label="Editar OS"><h2 style="margin:0 0 4px">Editar OS #${String(EO.id).padStart(6,'0')}</h2>
<label>Cliente / unidade<select ${sl} onchange="EO.d.c=this.value">${CL.map(c=>`<option ${d.c==c.n?'selected':''}>${esc(c.n)}</option>`).join('')}${CL.some(c=>c.n==d.c)?'':`<option selected>${esc(d.c)}</option>`}</select></label>
<label>Tipo de serviço<select ${sl} onchange="EO.d.t=this.value">${TPS.map(t=>`<option ${d.t==t?'selected':''}>${t}</option>`).join('')}</select></label>
<label>Status<select ${sl} onchange="EO.d.s=this.value">${Object.keys(SM).map(k=>`<option value="${k}" ${d.s==k?'selected':''}>${SM[k]}</option>`).join('')}</select></label>
<label>Data e horário<input type="datetime-local" ${sl} value="${esc(d.dt)}" onchange="EO.d.dt=this.value"></label>
<label>Técnicos</label>${EO.L.map((t,j)=>`<label class="ck"><input type=checkbox ${d.e.includes(t)?'checked':''} onchange="eot(${j})">${esc(t)}</label>`).join('')}
<label>Descrição do serviço<textarea rows=3 ${sl} oninput="EO.d.desc=this.value">${esc(d.desc)}</textarea></label>
<div style="display:flex;justify-content:space-between;gap:8px;margin-top:18px"><button class="btn g" onclick="EO=null;eom()">Cancelar</button><button class="b ab" onclick="eod()">Excluir OS</button><button class="btn" onclick="eos()">Salvar</button></div></div></div>`}
function eos(){const d=EO.d,o=OS.find(x=>x.id==EO.id);if(!d.c)return toast('Escolha o cliente / unidade');if(!d.e.length)return toast('Escolha ao menos um técnico');
if(o.ck&&o.ck.local==o.c)o.ck.local=d.c;o.c=d.c;o.t=d.t;o.s=d.s;o.e=d.e.join(' / ');o.dt=d.dt;if(d.dt)o.d=fdt(d.dt);o.desc=d.desc;EO=null;eom();toast('OS atualizada');rd()}
function eod(){$('ov').innerHTML=`<div class="ov"><div class="md" role="dialog" aria-label="Excluir OS"><h2 style="margin:0 0 8px">Excluir a OS #${String(EO.id).padStart(6,'0')}?</h2><p class="mu">O checklist, as fotos e as assinaturas dela também serão apagados. Esta ação não pode ser desfeita.</p><div style="display:flex;justify-content:space-between;margin-top:18px"><button class="btn g" onclick="eom()">Voltar</button><button class="btn" style="background:var(--er)" onclick="eody()">Excluir</button></div></div></div>`}
function eody(){const i=OS.findIndex(x=>x.id==EO.id);if(i>=0)OS.splice(i,1);EO=null;$('ov').innerHTML='';if(V=='det')V='os';toast('OS excluída');rd()}
draw();
</script></body></html>
